<html>
<head>

    <script src="functions.js"></script>
    <script src="classes.js"></script>
    <script src="events.js"></script>
    <script src="map_functions.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="powder_box">

    <canvas id="canvas"></canvas>

<div id="toolbar">

    <button class="toggle" id="pause" data-element-id = "-1">pause</button>
    <button class="tool" id="air" data-element-id = "0">air</button>
    <button class="tool" id="barrier" data-element-id = "1">barrier</button>
    <button class="tool" id="sand" data-element-id = "2">sand</button>
    <button class="tool" id="water" data-element-id = "3">water</button>
    
</div>

</div>

</body>
<script>

const pause_button = document.getElementById("pause");
const air_button = document.getElementById("air");
const barrier_button = document.getElementById("barrier");
const sand_button = document.getElementById("sand");

//size
const max_x=8;
const max_y=16;

const scale = 50;


const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = max_x;
canvas.height = max_y;

canvas.style.width = `${max_x * scale}px`;
canvas.style.height = `${max_y * scale}px`;

// ctx.fillStyle = "red"
// ctx.fillRect(1, 1, 1, 1);  


let current_operations=0;

let id_map=[];
initalize_map(id_map,0);

let update_map=[];
initalize_map(update_map,0);

// big_map.show_map_all()
// big_map.show_map_canvas()

console.log("we're starting")
//ai made, change
const FPS = 30;
const FRAME_TIME = 1000 / FPS;

let lastUpdate = 0;

function frame_manager(time) {
    if (time - lastUpdate >= FRAME_TIME) 
    {
        lastUpdate = time;
        if(game_paused==false)
    {

        update_pixels(id_map,update_map);
        update_screen(id_map,update_map);
    }

    }
    requestAnimationFrame(frame_manager);
}

requestAnimationFrame(frame_manager);


//test
let selected_item =2; //sand
let place=false;
canvas.addEventListener("mousedown", (event) =>
{
place=true;
});

canvas.addEventListener("mouseup", (event) =>
{
place=false;
});

canvas.addEventListener("mousemove", (event) => {

    if(place==true)
{

    const rect = canvas.getBoundingClientRect();

    const mouse_x = Math.floor((event.clientX - rect.left)/scale);
    const mouse_y = Math.floor((event.clientY - rect.top)/scale);

    id_map[mouse_y][mouse_x]=selected_item;
    update_map[mouse_y][mouse_x]=1;
    uptdate_screen_pixel(mouse_y,mouse_x);
    console.log(mouse_x, mouse_y);

}

});

canvas.addEventListener("click", (event) => {

    const rect = canvas.getBoundingClientRect();

    const mouse_x = Math.floor((event.clientX - rect.left)/scale);
    const mouse_y = Math.floor((event.clientY - rect.top)/scale);

    id_map[mouse_y][mouse_x]=selected_item;
    update_map[mouse_y][mouse_x]=1;
    uptdate_screen_pixel(mouse_y,mouse_x);
    console.log(mouse_x, mouse_y);

});

let game_paused=false;
pause_button.addEventListener("click",(event)=>
{
game_paused=!game_paused;
console.log(game_paused);
});

const buttons = document.querySelectorAll(".tool");

//the pixel selector
buttons.forEach(btn => {
  btn.addEventListener("click", function() {
    console.log("Selected tool:", btn.dataset.elementId);
    selected_item=parseFloat(btn.dataset.elementId);
  });
});

</script>




</html>
