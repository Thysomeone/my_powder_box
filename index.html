<html>
<head>

    <script src="functions.js"></script>
    <script src="classes.js"></script>
    <script src="events.js"></script>
    <script src="map_functions.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="powder_box">

    <canvas id="canvas"></canvas>

<div id="toolbar">

    <button class="toggle" id="pause" data-element-id = "-1">pause</button>
    <button class="tool" id="gas_void" data-element-id = "0">void</button>
    <button class="tool" id="barrier" data-element-id = "1">barrier</button>
    <button class="tool" id="air" data-element-id = "2">air</button>
    <button class="tool" id="sand" data-element-id = "3">sand</button>
    <button class="tool" id="water" data-element-id = "4">water</button>
    <button class="tool" id="wood" data-element-id = "5">wood</button>
    
</div>

<div id="toolbar">
    <button class="setting" id="increase_brush_size" data-value = "1">+</button>
    <button class="setting" id="decrease_brush_size" data-value = "-1">-</button>
</div>

<div id="fpsCounter" style="position:fixed; top:5px; left:5px; color:#0f0; font-family:monospace; font-size:15px;z-index:100;"></div>

</div>

</body>
<script>

const pause_button = document.getElementById("pause");
const air_button = document.getElementById("air");
const barrier_button = document.getElementById("barrier");
const sand_button = document.getElementById("sand");

//size
const max_x=100;
const max_y=160;

const scale = 5;

//start elem
const start_elem_id=0;

//how we show stuff
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = max_x;
canvas.height = max_y;
//
const imageData = ctx.createImageData(max_x, max_y);
const data = imageData.data;

canvas.width = max_x;
canvas.height = max_y;

canvas.style.width = `${max_x * scale}px`;
canvas.style.height = `${max_y * scale}px`;

// fill with a gradient, just to see it work
for (let y = 0; y < max_y; y++) {
  for (let x = 0; x < max_x; x++) {
    const i = (y * max_x + x) * 4;
    data[i]     =pixels[start_elem_id].colour[0];  // R
    data[i + 1] =pixels[start_elem_id].colour[1]// G
    data[i + 2] =pixels[start_elem_id].colour[2]// B
    data[i + 3] = 255;                // A (fully opaque)
  }
}



let current_operations=0;

//the map that contains the id of pixels
//(replaced pixel_map for preformance reasons)
let id_map=[];
initalize_map(id_map,start_elem_id);

//used to keep track of what pixels were updated
let pixel_update_map=[];
initalize_map(pixel_update_map,0);



let region_map = []; //splits the game in regions for efficency
const region_map_scale = 10;
const region_max_y = Math.trunc(max_y/region_map_scale) //max_p_y converted for region
const region_max_x = Math.trunc(max_x/region_map_scale) //max_p_x converted for region
initalize_map_custom_size(region_map,2,max_y/region_map_scale,max_x/region_map_scale)



ctx.putImageData(imageData, 0, 0);
console.log("we're starting")

//ai made, change
const FPS = 30;
const FRAME_TIME = 1000 / FPS;

let lastUpdate = 0;

// --- fps counter state ---
let fpsCounter = 0;
let fpsDisplay = 0;
let fpsLastCheck = 0;

function frame_manager(time) {
    if (time - lastUpdate >= FRAME_TIME)
    {
        lastUpdate = time;

        if (game_paused == false)
        {
            update_pixels(id_map);
            clean_region_map(region_map);
        }

        //screen gets updated once per frame
        //we always do it so we dot put screen updates
        //in the functions that handle input
        update_screen();

        // count this as one real simulation/render tick
        fpsCounter++;
    }

    // update the displayed number once per second
    if (time - fpsLastCheck >= 1000)
    {
        fpsDisplay = fpsCounter;
        fpsCounter = 0;
        fpsLastCheck = time;
        document.getElementById("fpsCounter").textContent = `FPS: ${fpsDisplay}`;
    }

    requestAnimationFrame(frame_manager);
}

requestAnimationFrame(frame_manager);


//test
let selected_item =3; //sand
let place=false;


//ai made code, replace

canvas.addEventListener("mousedown", (event) =>
{
    place = true;
});

canvas.addEventListener("mouseup", (event) =>
{
    place = false;
});

canvas.addEventListener("mousemove", (event) => {
    if (place == true)
    {
        handle_paint(event.clientX, event.clientY);
    }
});

// --- touch support ---

canvas.addEventListener("touchstart", (event) => {
    event.preventDefault(); // stop scrolling/zooming while drawing
    place = true;
    const touch = event.touches[0];
    handle_paint(touch.clientX, touch.clientY);
}, { passive: false });

canvas.addEventListener("touchend", (event) => {
    event.preventDefault();
    place = false;
}, { passive: false });

canvas.addEventListener("touchcancel", (event) => {
    place = false;
});

canvas.addEventListener("touchmove", (event) => {
    event.preventDefault(); // stop the page from scrolling as you drag
    if (place == true)
    {
        const touch = event.touches[0];
        handle_paint(touch.clientX, touch.clientY);
    }
}, { passive: false });

// shared logic, so mouse and touch don't duplicate code
function handle_paint(clientX, clientY)
{
    const rect = canvas.getBoundingClientRect();

    const mouse_x = Math.floor((clientX - rect.left) / scale);
    const mouse_y = Math.floor((clientY - rect.top) / scale);

    // bounds check — easy to go out of range on touch
    if (mouse_x < 0 || mouse_x >= max_x || mouse_y < 0 || mouse_y >= max_y)
        return;

    change_pixles(mouse_y,mouse_x,brush_size);
}
//end of ai code


canvas.addEventListener("click", (event) => {

    const rect = canvas.getBoundingClientRect();

    handle_paint(event.clientX,event.clientY)

});

let game_paused=false;
pause_button.addEventListener("click",(event)=>
{
game_paused=!game_paused;
console.log("is game paused ",game_paused);
});

const buttons = document.querySelectorAll(".tool");

//the pixel selector
buttons.forEach(btn => {
  btn.addEventListener("click", function() {
    console.log("Selected tool:", btn.dataset.elementId);
    selected_item=parseFloat(btn.dataset.elementId);
  });
});

const setting_buttons = document.querySelectorAll(".setting");



//the brush size selector
let brush_size=5;
setting_buttons.forEach(btn => {
  btn.addEventListener("click", function() {
    brush_size=brush_size + parseFloat(btn.dataset.value);
    if(brush_size<1)
  {
    brush_size=1;
  }
    console.log("b_size", brush_size);
  });
});

</script>




</html>
